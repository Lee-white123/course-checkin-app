services:
  mysql:
    image: mysql
    container_name: course-checkin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - course_checkin_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: course-checkin-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS}
      AUTH_SECRET: ${AUTH_SECRET}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - course_checkin_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: course-checkin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - course_checkin_net

volumes:
  mysql_data:

networks:
  course_checkin_net:
    driver: bridge
