<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课时消除管理系统</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">本地简易版</p>
        <h1>课时消除管理系统</h1>
      </div>
      <div class="db-pill">SQLite 自动保存</div>
    </header>

    <nav class="tabs" aria-label="系统模块">
      <button class="tab active" data-tab="dashboard">概览</button>
      <button class="tab" data-tab="admin">后台管理</button>
      <button class="tab" data-tab="teacher">老师消课</button>
      <button class="tab" data-tab="parent">家长查看</button>
    </nav>

    <main>
      <section id="dashboard" class="panel active">
        <div class="metrics" id="metrics"></div>
        <section class="section">
          <div class="section-head">
            <h2>最近课程安排</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>学生</th>
                  <th>课程</th>
                  <th>老师</th>
                  <th>时间</th>
                  <th>课时</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="dashboardSchedules"></tbody>
            </table>
          </div>
        </section>
      </section>

      <section id="admin" class="panel">
        <div class="grid three">
          <form class="box" id="teacherForm">
            <h2>新增老师</h2>
            <label>姓名<input name="name" required placeholder="例如：王老师" /></label>
            <label>手机号<input name="phone" placeholder="可选" /></label>
            <label>授课科目<input name="subject" placeholder="数学 / 英语" /></label>
            <button type="submit">保存老师</button>
          </form>

          <form class="box" id="studentForm">
            <h2>新增学生</h2>
            <label>学生姓名<input name="name" required placeholder="例如：陈小明" /></label>
            <label>年级<input name="grade" placeholder="初一" /></label>
            <label>家长姓名<input name="parent_name" placeholder="陈女士" /></label>
            <label>家长电话<input name="parent_phone" placeholder="可选" /></label>
            <label>购买课时<input name="purchased_hours" type="number" step="0.5" min="0" value="20" /></label>
            <button type="submit">保存学生</button>
          </form>

          <form class="box" id="courseForm">
            <h2>新增课程</h2>
            <label>课程名称<input name="name" required placeholder="初一数学同步" /></label>
            <label>课程类型<input name="category" placeholder="一对一 / 小班课" /></label>
            <label>单次课时<input name="hours_per_lesson" type="number" step="0.5" min="0.5" value="2" /></label>
            <button type="submit">保存课程</button>
          </form>
        </div>

        <form class="box schedule-form" id="scheduleForm">
          <h2>课程编排</h2>
          <div class="form-grid">
            <label>学生<select name="student_id" required></select></label>
            <label>老师<select name="teacher_id" required></select></label>
            <label>课程<select name="course_id" required></select></label>
            <label>星期
              <select name="weekday">
                <option>周一</option>
                <option>周二</option>
                <option>周三</option>
                <option>周四</option>
                <option>周五</option>
                <option>周六</option>
                <option>周日</option>
              </select>
            </label>
            <label>开始时间<input name="start_time" type="time" value="18:00" required /></label>
            <label>结束时间<input name="end_time" type="time" value="20:00" required /></label>
            <label>日期<input name="planned_date" type="date" /></label>
            <label>课时<input name="lesson_hours" type="number" step="0.5" min="0.5" value="2" /></label>
          </div>
          <label>备注<textarea name="remark" rows="2" placeholder="本节课计划、注意事项等"></textarea></label>
          <button type="submit">添加排课</button>
        </form>

        <section class="section">
          <h2>基础数据管理</h2>
          <div class="grid four">
            <div>
              <h3>老师</h3>
              <div id="teacherCards" class="cards"></div>
            </div>
            <div>
              <h3>学生</h3>
              <div id="studentCards" class="cards"></div>
            </div>
            <div>
              <h3>课程</h3>
              <div id="courseCards" class="cards"></div>
            </div>
            <div>
              <h3>排课</h3>
              <div id="scheduleCards" class="cards"></div>
            </div>
          </div>
        </section>

        <div class="grid two">
          <section class="section">
            <h2>学生课时余额</h2>
            <div id="studentBalanceCards" class="cards"></div>
          </section>
          <section class="section">
            <h2>全部消课记录</h2>
            <div id="adminRecords" class="record-list"></div>
          </section>
        </div>
      </section>

      <section id="teacher" class="panel">
        <div class="toolbar">
          <label>选择老师<select id="teacherSelect"></select></label>
        </div>
        <div id="teacherSchedules" class="course-list"></div>
      </section>

      <section id="parent" class="panel">
        <div class="toolbar">
          <label>选择学生<select id="studentSelect"></select></label>
        </div>
        <div class="grid two">
          <section class="section">
            <h2>课程表</h2>
            <div id="parentSchedules" class="course-list"></div>
          </section>
          <section class="section">
            <h2>历史上课记录</h2>
            <div id="parentRecords" class="record-list"></div>
          </section>
        </div>
      </section>
    </main>

    <div class="toast" id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
